# Atelic × Dell methane demo, offline laptop build. Started by atelicxdell (.sh / .ps1), which writes .env beside it.
# Images are prebuilt (deploy/offline/build_push.sh). Agents replay recorded runs; no model is called (OFFLINE=1).
# Each demo on a laptop has its own project name, so containers and databases never mix; only the web port is
# published, on localhost only.
name: ${DEMO_NAME:-atelic-dell}
services:
  neo4j:
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD:?set NEO4J_PASSWORD}"
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
    volumes: [graph-data:/data]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  influxdb:
    image: influxdb:2.9.1
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: atelic-admin
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUX_PASSWORD:?set INFLUX_PASSWORD}
      DOCKER_INFLUXDB_INIT_ORG: atelic
      DOCKER_INFLUXDB_INIT_BUCKET: incident-observations
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUX_TOKEN:?set INFLUX_TOKEN}
      DOCKER_INFLUXDB_INIT_RETENTION: 0
    volumes: [influx-data:/var/lib/influxdb2]
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: atelic
      POSTGRES_DB: atelic
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes: [workflow-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atelic -d atelic"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.17.1
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:?set QDRANT_API_KEY}
    volumes: [documents-data:/qdrant/storage]
    restart: unless-stopped

  engine:
    image: ${REGISTRY:-ghcr.io/atelicai}/dell-demo-engine:${TAG:-offline}
    environment: &engine-env
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      HISTORIAN_BACKEND: influxdb
      INFLUX_URL: http://influxdb:8086
      INFLUX_ORG: atelic
      INFLUX_BUCKET: incident-observations
      INFLUX_TOKEN: ${INFLUX_TOKEN}
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ${QDRANT_API_KEY}
      WORKFLOW_DATABASE_URL: postgresql://atelic_runtime:${WORKFLOW_RUNTIME_PASSWORD:?set WORKFLOW_RUNTIME_PASSWORD}@postgres:5432/atelic
      LLM_MODEL: nvidia/nemotron-3-ultra-550b-a55b
      OFFLINE: "1"
    depends_on:
      neo4j: {condition: service_healthy}
      influxdb: {condition: service_healthy}
      postgres: {condition: service_healthy}
      qdrant: {condition: service_started}
    restart: unless-stopped

  # One-shot, run by the launcher on first start and after an update.
  seed:
    image: ${REGISTRY:-ghcr.io/atelicai}/dell-demo-engine:${TAG:-offline}
    profiles: ["seed"]
    command: ["/srv/scripts/seed.sh"]
    environment:
      <<: *engine-env
      WORKFLOW_ADMIN_DATABASE_URL: postgresql://atelic:${POSTGRES_PASSWORD}@postgres:5432/atelic
      WORKFLOW_RUNTIME_PASSWORD: ${WORKFLOW_RUNTIME_PASSWORD}
      ENGINEER_TOKEN: ${ENGINEER_TOKEN:?set ENGINEER_TOKEN}
      ENGINEER_ID: demo-engineer
    depends_on:
      neo4j: {condition: service_healthy}
      influxdb: {condition: service_healthy}
      postgres: {condition: service_healthy}
      qdrant: {condition: service_started}

  backend:
    image: ${REGISTRY:-ghcr.io/atelicai}/dell-demo-backend:${TAG:-offline}
    environment:
      ENGINE_URL: http://engine:8000
      ENGINEER_TOKEN: ${ENGINEER_TOKEN}
      DATA_DIR: /data
      UI_STATE_FILE: /state/state.json
      DEPLOYMENT_LABEL: Offline laptop (Docker Compose)
      LOGIN_USER: ${LOGIN_USER:-atelic}
      LOGIN_PASSWORD: ${LOGIN_PASSWORD:?set LOGIN_PASSWORD}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET}
      OFFLINE: "1"
    volumes: [ui-state:/state]
    depends_on: [engine]
    restart: unless-stopped

  web:
    image: ${REGISTRY:-ghcr.io/atelicai}/dell-demo-web:${TAG:-offline}
    environment:
      SITE_ADDRESS: ":8080"
    ports:
      - "127.0.0.1:${HTTP_PORT:-8080}:8080"
    volumes: [caddy-data:/data]
    depends_on: [backend]
    restart: unless-stopped

volumes:
  graph-data:
  influx-data:
  workflow-data:
  documents-data:
  ui-state:
  caddy-data:
