<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Methane observations — Atelic</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/theme.css?v=101">
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="css/shell.css?v=101">
<script src="js/shell.js?v=105" defer></script>
<script src="vendor/leaflet/leaflet.js" defer></script>
<script src="js/overview.js?v=105" defer></script>
<style>
  /* PRD Screen 1: 65% map / 35% source details */
  .ov-grid{display:grid;grid-template-columns:65fr 35fr;gap:14px;margin-top:14px;align-items:stretch}
  .ov-grid > .panel{min-height:0}
  .ov-grid.fill{flex:0 1 auto;height:100%;max-height:700px}
  main.fit .lede{margin-bottom:12px}
  .inc-count{margin-left:auto;color:var(--accent);text-decoration:none}
  .inc-count:hover{text-decoration:underline}

  /* ----- satellite map (Leaflet) ----- */
  .map-panel{overflow:hidden;display:flex;flex-direction:column}
  /* isolation keeps Leaflet's pane z-indexes (400-1000) inside the map, below the top bar's popovers and dialogs */
  .map-wrap{position:relative;flex:1;min-height:0;background:var(--panel-3);isolation:isolate}
  .map-wrap .leaflet-container{position:absolute;inset:0;background:var(--panel-3);font-family:var(--sans)}
  /* Muted basemap so the plume reads first (as on the Carbon Mapper portal). */
  .map-wrap .basemap{filter:grayscale(.85) brightness(1.08) contrast(.92)}
  .map-wrap .plume-img{transition:opacity var(--t-slow)}
  .map-wrap .leaflet-control-attribution{font-size:10px;background:rgba(255,255,255,.8)}
  .map-wrap .leaflet-bar a{color:var(--ink)}
  .origin-pin{position:relative}
  .origin-pin .core{position:absolute;inset:6px;border-radius:50%;background:#fff;border:2px solid var(--pink);box-shadow:0 0 0 2px rgba(255,255,255,.7)}
  .origin-pin .dot{position:absolute;inset:11px;border-radius:50%;background:var(--pink)}
  .origin-pin .ring{position:absolute;inset:0;border-radius:50%;border:2px solid var(--accent);opacity:0}
  .origin-pin.selected .ring{opacity:1;animation:pin-pulse 2.4s ease-out infinite}
  @keyframes pin-pulse{0%{transform:scale(.7);opacity:.9}100%{transform:scale(1.9);opacity:0}}
  .origin-tag{font-family:var(--mono);font-size:11px;font-weight:600;color:var(--ink);background:rgba(255,255,255,.88);border:1px solid var(--line-strong);border-radius:4px;padding:1px 6px;box-shadow:none}
  .origin-tag::before{display:none}

  .legend{position:absolute;left:10px;bottom:24px;z-index:500;padding:8px 10px;border-radius:4px;border:1px solid var(--line-strong);background:rgba(255,255,255,.9);font-size:10.5px;color:var(--ink-mute);line-height:1.35}
  .legend .t{font-family:var(--mono);font-size:9.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-dim)}
  .legend .bar{width:120px;height:8px;border-radius:4px;margin:5px 0 3px;background:linear-gradient(90deg,#ffffb2,#fecc5c,#fd8d3c,#f03b20,#bd0026)}
  .legend .ends{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10px}
  .map-empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:var(--ink-mute);font-size:13px;padding:24px;z-index:600}
  .map-tools{display:flex;align-items:center;gap:14px;padding:9px 16px;border-top:1px solid var(--line);font-size:12.5px;color:var(--ink-mute)}
  .map-tools label{display:flex;align-items:center;gap:7px;cursor:pointer;white-space:nowrap}
  .map-tools input{accent-color:var(--accent)}
  .map-tools .link{background:none;border:0;padding:0;cursor:pointer;color:var(--accent);font-weight:600;font-size:12.5px;white-space:nowrap}

  /* ----- source details ----- */
  .src-panel{display:flex;flex-direction:column;transition:border-color var(--t), box-shadow var(--t)}
  .src-panel.selected{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-glow)}
  .src-panel .panel-head .badge{margin-left:auto}
  #src-body{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column}
  .sample-flag{margin:14px 18px 0;color:var(--ink-dim);font-size:11.5px;line-height:1.45}
  .sample-flag b{color:var(--warn);font-weight:600}

  /* hero: the rate is the key number */
  .rate{padding:10px 18px 16px;border-bottom:1px solid var(--line)}
  .rate .lbl{font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-dim)}
  .rate .num{display:flex;align-items:baseline;gap:8px;margin-top:6px}
  .rate .num b{font-size:clamp(34px,4.4vh,60px);font-weight:700;letter-spacing:-.02em;line-height:1;font-variant-numeric:tabular-nums}
  .rate .num span{font-family:var(--mono);font-size:13px;color:var(--ink-mute)}
  .rate .unc{font-family:var(--mono);font-size:12px;color:var(--ink-mute);margin-top:6px}
  .unc-bar{position:relative;height:6px;border-radius:3px;background:var(--panel-3);margin-top:10px}
  .unc-bar .band{position:absolute;top:0;bottom:0;border-radius:3px;opacity:.35}
  .unc-bar .mid{position:absolute;top:-4px;width:2px;height:14px;border-radius:1px}
  .unc-ends{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10px;color:var(--ink-dim);margin-top:5px}

  /* facts: quiet label over value, 2 columns, no boxes (the header badge covers the whole card) */
  .facts{display:grid;grid-template-columns:1fr 1fr;gap:clamp(12px,2vh,22px) 18px;padding:clamp(14px,2.2vh,24px) 18px}
  .fact .lbl{font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-dim)}
  .fact .val{font-family:var(--mono);font-size:13px;font-weight:500;margin-top:4px;color:var(--ink);white-space:nowrap}
  .fact .val small{display:block;font-size:11px;color:var(--ink-dim);margin-top:1px}
  .fact .val.na{color:var(--ink-dim)}

  .source-line{display:flex;align-items:center;gap:8px;margin:auto 18px 0;padding:9px 0;border-top:1px solid var(--line);font-size:12px;color:var(--ink-mute)}
  .source-line .r{margin-left:auto;font-family:var(--mono);font-size:11.5px}
  .source-line a.r{color:var(--accent);font-weight:600}
  .source-line .r.na{color:var(--ink-dim)}
  .src-actions{padding:4px 18px 16px;border-top:1px solid var(--line);padding-top:12px}
  .src-actions .btn{width:100%;justify-content:center;padding:11px 16px}
  .missing{padding:22px 18px;color:var(--ink-mute);font-size:13px}

  /* gas flag (non-methane observations) */
  .gas-flag{margin:12px 18px 0;padding:6px 10px;border-radius:4px;background:var(--accent-glow);color:var(--ink-mute);font-size:11.5px;line-height:1.45}
  .gas-flag b{color:var(--accent-strong);font-weight:600}
  .rate .sub{font-size:11.5px;color:var(--ink-mute);margin-top:4px}
  /* provider rate history for the source */
  .hist{padding:10px 18px 4px;border-bottom:1px solid var(--line)}
  .hist .lbl{font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-dim);display:flex}
  .hist .lbl span{margin-left:auto;letter-spacing:0;text-transform:none;font-weight:500}
  .hist svg{display:block;width:100%;margin-top:4px}
  .hist .note{font-size:11px;color:var(--ink-dim);margin:0 0 6px}
  .hist .ax{font-family:var(--mono);font-size:9.5px;fill:var(--ink-dim)}
  .hist .gl{stroke:var(--line-strong);stroke-width:1}
  .hist .ln{fill:none;stroke:var(--violet);stroke-width:1.5}
  .hist .wk{stroke:var(--violet);stroke-opacity:.35;stroke-width:1}
  .hist .pt{fill:var(--violet)}
  .hist .now{stroke:var(--pink);stroke-width:1;stroke-dasharray:3 3}
  .hist .nowt{font-family:var(--mono);font-size:9.5px;fill:var(--pink)}

  .boundary{font-size:11.5px;color:var(--ink-mute);display:flex;gap:8px;align-items:center;min-width:0}
  .boundary span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  @media (max-width:1100px){.ov-grid{grid-template-columns:1fr}main.fit{height:auto}}
</style>
</head>
<body data-page="overview">

<aside class="rail" id="rail"></aside>
<header class="topbar" id="topbar"></header>

<main class="wide fit">
  <div class="page-head">
    <h1 id="page-title" title="Review regional emissions observations and explore an equipment-level investigation.">Methane observations</h1>
    <a class="sub inc-count" id="inc-count" href="incidents.html" hidden></a>
  </div>


  <div class="ov-grid fill">
    <!-- 65%: map -->
    <section class="panel map-panel" aria-label="Observation map">
      <div class="panel-head">
        <h2>Regional observation</h2>
      </div>
      <div class="map-wrap" id="map">
        <div class="map-empty" id="map-empty">Loading observation…</div>
      </div>
      <div class="map-tools">
        <label><input type="checkbox" id="toggle-footprint" checked> Show plume footprint</label>
        <label title="Tanager-1 true-colour imagery from the observation pass, served by Carbon Mapper"><input type="checkbox" id="toggle-scene"> Observation-day imagery</label>
        <button class="link" id="btn-recenter" type="button">Recenter</button>
        <span class="boundary" style="margin-left:auto"><span class="badge hypothesis">Boundary</span><span title="A satellite observation does not identify a specific valve or component.">A satellite observation does not identify a specific valve or component.</span></span>
      </div>
    </section>

    <!-- 35%: source details -->
    <section class="panel src-panel" id="src-panel" aria-label="Source details">
      <div class="panel-head">
        <h2>Carbon Mapper satellite observation</h2>
        <span id="src-badge"></span>
      </div>
      <div id="src-body"><div class="missing">Loading…</div></div>
      <div class="src-actions">
        <button class="btn primary" id="btn-explore">Explore on-site investigation →</button>
      </div>
    </section>
  </div>

</main>

<!-- Addendum B transition notice -->

</body>
</html>
