<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Knowledge graph — Atelic</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/theme.css?v=101">
<link rel="stylesheet" href="css/shell.css?v=101">
<script src="js/shell.js?v=107" defer></script>
<script src="vendor/cytoscape/cytoscape.min.js" defer></script>
<script src="js/graph.js?v=404" defer></script>
<style>
  main.wide{max-width:1600px}
  .page-head{align-items:baseline;gap:14px;margin-bottom:14px}
  .page-head .stats{font-family:var(--mono);font-size:11px;color:var(--ink-mute)}
  .page-head .src{margin-left:auto;font-size:11.5px;color:var(--ink-mute)}

  /* ===== workspace: graph + records on the left, inspector on the right ===== */
  .ws{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:14px;align-items:start}
  .ws-main{display:flex;flex-direction:column;gap:14px;min-width:0}

  /* toolbar */
  .bar{display:flex;align-items:center;gap:10px;padding:8px 10px;border-bottom:1px solid var(--line);flex-wrap:wrap}
  .bar .sp{flex:1}
  .seg{display:inline-flex;height:28px;border:1px solid var(--line-strong);border-radius:var(--radius);background:var(--panel-2);padding:2px;gap:2px}
  .seg button{display:inline-flex;align-items:center;gap:6px;font:500 12px var(--sans);padding:0 10px;border:0;border-radius:3px;background:none;color:var(--ink-mute);cursor:pointer;white-space:nowrap}
  .seg button:hover:not([disabled]){color:var(--ink)}
  .seg button[aria-pressed=true]{background:var(--panel);color:var(--ink);box-shadow:0 0 0 1px var(--line-strong)}
  .seg button[disabled]{color:var(--ink-faint);cursor:not-allowed}
  .seg button:focus-visible,.tool:focus-visible,.chip:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
  .seg .k{font:500 11px var(--mono);color:var(--ink-dim)}
  .seg button[aria-pressed=true] .k{color:var(--accent)}
  .tool{display:inline-flex;align-items:center;gap:7px;height:28px;padding:0 10px;border:1px solid var(--line-strong);border-radius:var(--radius);background:var(--panel);color:var(--ink);font:500 12px var(--sans);cursor:pointer;white-space:nowrap}
  .tool:hover{border-color:var(--accent)}
  .tool[disabled]{color:var(--ink-faint);cursor:not-allowed;border-color:var(--line)}
  .tool svg{color:var(--ink-mute)}
  .find .dd-btn{width:210px}

  /* type filters = legend */
  .types{display:flex;flex-wrap:wrap;gap:6px;padding:8px 10px;border-bottom:1px solid var(--line);background:var(--panel-2)}
  .chip{display:inline-flex;align-items:center;gap:7px;height:26px;padding:0 9px 0 4px;border:1px solid var(--line-strong);border-radius:13px;background:var(--panel);font:500 11.5px var(--sans);color:var(--ink);cursor:pointer}
  .chip img{width:18px;height:18px;border-radius:50%;display:block}
  .chip .k{font:500 10.5px var(--mono);color:var(--ink-mute)}
  .chip[aria-pressed=false]{background:none;color:var(--ink-dim);border-style:dashed}
  .chip[aria-pressed=false] img{opacity:.35;filter:grayscale(1)}
  .chip:hover{border-color:var(--accent)}

  .ctx{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:6px 12px;border-bottom:1px solid var(--line);font-size:12px;color:var(--ink-mute);min-height:32px}
  .ctx b{font:600 11.5px var(--mono);color:var(--ink)}
  .ctx .dot{width:7px;height:7px;border-radius:50%;background:var(--ink-dim)}
  .ctx .dot.bad{background:var(--bad)} .ctx .dot.good{background:var(--good)} .ctx .dot.acc{background:var(--accent)}
  .ctx .act{margin-left:auto;display:flex;gap:12px}

  .c-done{fill:var(--good)} .c-open,.c-deferred{fill:var(--warn)} .c-not_done{fill:var(--bad)}
  .st.ml0{margin-left:0}
  .i-ty img{border-radius:50%;flex-shrink:0}
  .fade-in{animation:kgFade .26s cubic-bezier(.2,.7,.3,1)}
  @keyframes kgFade{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
  .seg button,.chip,.tool,.tabs button{transition:background var(--t),color var(--t),border-color var(--t),box-shadow var(--t)}
  .chip img{transition:opacity var(--t),filter var(--t)}
  @media (prefers-reduced-motion:reduce){.fade-in{animation:none}}
  /* canvas */
  .canvas{position:relative;height:560px;background:var(--panel)}
  #cy{position:absolute;inset:0}
  .cy-empty{padding:60px 20px;text-align:center;font-size:13px;color:var(--ink-mute)}
  .zoom{position:absolute;right:10px;bottom:10px;display:flex;flex-direction:column;border:1px solid var(--line-strong);border-radius:var(--radius);background:var(--panel);overflow:hidden;box-shadow:0 1px 3px rgba(15,23,42,.06);z-index:5}
  .zoom button{width:30px;height:28px;border:0;border-top:1px solid var(--line);background:none;color:var(--ink-mute);cursor:pointer;display:grid;place-items:center}
  .zoom button:first-child{border-top:0}
  .zoom button:hover{background:var(--panel-2);color:var(--ink)}
  .state-key{display:flex;flex-wrap:wrap;align-items:center;gap:4px 16px;padding:7px 12px;border-top:1px solid var(--line);font-size:11px;color:var(--ink-mute)}
  .state-key span{display:inline-flex;align-items:center;gap:6px}
  .state-key i{width:11px;height:11px;border-radius:50%;border:2.5px solid;background:var(--panel)}
  .state-key .hint{margin-left:auto}
  .state-key b{font-weight:600;color:var(--ink)}
  .state-key span{display:inline-flex;align-items:center;gap:7px}
  .state-key i{width:11px;height:11px;border-radius:50%;border:2.5px solid;background:var(--panel)}

  /* ===== records panel (tabs) ===== */
  .tabs{display:flex;align-items:stretch;gap:2px;padding:0 10px;border-bottom:1px solid var(--line)}
  .tabs button{position:relative;display:inline-flex;align-items:center;gap:7px;padding:11px 10px 10px;border:0;background:none;font:500 12.5px var(--sans);color:var(--ink-mute);cursor:pointer}
  .tabs button:hover:not([disabled]){color:var(--ink)}
  .tabs button[aria-selected=true]{color:var(--ink);font-weight:600}
  .tabs button[aria-selected=true]::after{content:"";position:absolute;left:8px;right:8px;bottom:-1px;height:2px;background:var(--accent)}
  .tabs button[disabled]{color:var(--ink-faint);cursor:not-allowed}
  .tabs .k{font:500 11px var(--mono);color:var(--ink-dim)}
  .tabs .meta{margin-left:auto;align-self:center;font-size:11.5px;color:var(--ink-mute)}
  .lane-body{padding:14px 16px 16px}
  .note{font-size:12px;color:var(--ink-mute);line-height:1.5}

  /* history: one row per asset on one time axis */
  #tl{display:block;width:100%;height:auto}
  #tl text{font-family:var(--mono)}
  #tl .ax{stroke:var(--line-strong)}
  #tl .tick{font-size:10px;fill:var(--ink-mute)}
  #tl .grid{stroke:var(--line);stroke-dasharray:2 3}
  #tl .row-l{font-size:11px;font-weight:600;fill:var(--ink);cursor:pointer}
  #tl .row-l:hover,#tl .row.sel .row-l{fill:var(--accent)}
  #tl .row-n{font-family:var(--sans);font-size:10px;fill:var(--ink-mute)}
  #tl .row-bg{fill:var(--panel-2)}
  #tl .row.sel .row-bg{fill:var(--accent-glow)}
  #tl .m{cursor:pointer}
  #tl .m rect{fill:#475569;stroke:var(--panel);stroke-width:1.5}
  #tl .m.open rect{fill:var(--panel);stroke:var(--warn);stroke-width:2}
  #tl .m text{font-size:9.5px;font-weight:600;fill:var(--ink-mute)}
  #tl .m:hover rect{stroke:var(--accent);stroke-width:2}
  #tl .m:hover text{fill:var(--accent)}
  #tl .arc{fill:none;stroke:var(--accent);stroke-width:1.1;opacity:.45}
  #tl .now{stroke:var(--bad);stroke-width:1.4;stroke-dasharray:4 3}
  #tl .now-l{font-size:10px;font-weight:600;fill:var(--bad)}
  .tl-key{display:flex;flex-wrap:wrap;gap:4px 16px;margin-top:10px;font-size:11px;color:var(--ink-mute)}
  .tl-key span{display:inline-flex;align-items:center;gap:6px}
  .tl-key i{display:inline-block;width:9px;height:9px;background:#475569}
  .tl-key i.o{background:var(--panel);border:2px solid var(--warn)}
  .tl-key i.a{width:16px;height:0;border-top:1.5px solid var(--accent);opacity:.6;background:none}
  .tl-key i.d{width:7px;height:7px;border-radius:50%}

  /* records of one asset: a dated story */
  .story{list-style:none;margin:0;padding:0;position:relative;max-width:900px}
  .story::before{content:"";position:absolute;left:84px;top:6px;bottom:6px;border-left:1px solid var(--line-strong)}
  .rec{display:grid;grid-template-columns:72px 1fr;gap:0 25px;padding:0 0 14px;position:relative}
  .rec::before{content:"";position:absolute;left:80px;top:5px;width:9px;height:9px;background:#475569;border:1.5px solid var(--panel)}
  .rec.open::before{background:var(--panel);border:2px solid var(--warn)}
  .rec .when{font:600 11px var(--mono);color:var(--ink);text-align:right;padding-top:1px}
  .rec .when span{display:block;font-weight:500;font-size:10px;color:var(--ink-dim)}
  .card{border:1px solid var(--line-strong);border-radius:var(--radius);background:var(--panel);padding:10px 12px;transition:border-color var(--t),box-shadow var(--t)}
  .rec.hl .card{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-glow)}
  .card-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .card-top .wid{font:600 12px var(--mono);color:var(--ink)}
  .card-top .wt{font-size:11.5px;color:var(--ink-mute)}
  .st{margin-left:auto;font:600 9.5px var(--mono);letter-spacing:.06em;text-transform:uppercase;padding:2px 6px;border-radius:var(--radius-sm);color:var(--ink-mute);background:var(--panel-3)}
  .st.warn{color:var(--warn);background:var(--warn-glow)}
  .st.bad{color:var(--bad);background:var(--bad-glow)}
  .st.good{color:var(--good);background:var(--good-glow)}
  .card h3{margin:5px 0 6px;font-size:13px;font-weight:600;line-height:1.35}
  .card dl{display:grid;grid-template-columns:78px 1fr;gap:3px 10px;margin:0;font-size:12px;line-height:1.45}
  .card dt{font-size:11px;color:var(--ink-mute);padding-top:1px}
  .card dd{margin:0;color:var(--ink)}
  .cm{list-style:none;margin:8px 0 0;padding:8px 0 0;border-top:1px solid var(--line)}
  .cm li{display:grid;grid-template-columns:10px 1fr auto;gap:8px;align-items:baseline;font-size:12px;padding:2px 0}
  .cm li i{width:8px;height:8px;border-radius:50%;transform:translateY(1px)}
  .cm li .s{font:600 9.5px var(--mono);letter-spacing:.05em;text-transform:uppercase}
  .cm li .by{grid-column:2/4;font:500 10.5px var(--mono);color:var(--ink-dim)}
  .links{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:8px;font-size:11.5px;color:var(--ink-mute)}
  .fr{margin-top:8px;border-top:1px solid var(--line);padding-top:6px}
  .fr summary{cursor:pointer;font-size:12px;color:var(--ink-mute);list-style:none;display:flex;gap:8px;align-items:baseline}
  .fr summary::-webkit-details-marker{display:none}
  .fr summary::before{content:"▸";font-size:10px;color:var(--ink-dim)}
  .fr[open] summary::before{content:"▾"}
  .fr summary b{font:600 10.5px var(--mono);color:var(--ink)}
  .fr blockquote{margin:6px 0 2px;padding:6px 10px;border-left:2px solid var(--line-strong);background:var(--panel-2);font-size:12px;line-height:1.5;color:var(--ink)}
  .fr .who{font-size:10.5px;font-family:var(--mono);color:var(--ink-dim)}

  /* incident evidence: candidates side by side */
  .ev-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:12px;align-items:start}
  .ev-cand{border:1px solid var(--line-strong);border-radius:var(--radius)}
  .ev-cand.src{border-top:3px solid var(--warn)}
  .ev-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:9px 12px;border-bottom:1px solid var(--line)}
  .ev-h .linkish{font:600 13px var(--mono)}
  .ev-h .why{margin-left:auto;font:500 11px var(--mono);color:var(--ink-mute)}
  .ev-list{list-style:none;margin:0;padding:2px 12px 6px}
  .ev-list li{display:grid;grid-template-columns:62px 1fr;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:12px;line-height:1.45}
  .ev-list li:last-child{border-bottom:0}
  .ev-k{font:600 9.5px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-mute);padding-top:2px}
  .ev-k.for{color:var(--good)} .ev-k.gap{color:var(--warn)} .ev-k.against{color:var(--bad)}
  .ev-list .from{display:block;margin-top:2px;font-size:10.5px;color:var(--ink-dim);font-family:var(--mono)}
  .closed-note{margin-bottom:12px;padding:7px 10px;border-left:3px solid var(--good);background:var(--good-glow);font-size:12px;color:var(--ink)}

  /* ===== inspector ===== */
  .insp{position:sticky;top:64px;display:flex;flex-direction:column;max-height:calc(100vh - 80px)}
  .i-head{padding:14px 16px 12px;border-bottom:1px solid var(--line)}
  .i-ty{display:flex;align-items:center;gap:8px;font:600 10px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-mute)}
  .i-ty .x{margin-left:auto}
  .i-id{font:600 22px var(--mono);letter-spacing:-.02em;color:var(--ink);line-height:1.25;margin-top:4px}
  .i-nm{font-size:13px;color:var(--ink-mute)}
  .i-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .i-stats{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid var(--line)}
  .i-stats div{padding:9px 12px;border-left:1px solid var(--line)}
  .i-stats div:first-child{border-left:0}
  .i-stats b{display:block;font:600 17px var(--mono);color:var(--ink);line-height:1.2}
  .i-stats b.warn{color:var(--warn)}
  .i-stats span{display:block;font-size:11px;color:var(--ink-mute);line-height:1.3}
  .i-stats em{display:block;font:500 10.5px var(--mono);font-style:normal;color:var(--warn);line-height:1.4}
  .i-stats em.ok{color:var(--ink-dim)}
  .detail{padding:0 16px 14px;overflow-y:auto;flex:1;min-height:0}
  .detail h4{display:flex;align-items:center;gap:6px;margin:16px 0 4px;font:600 10px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-mute)}
  .detail h4 .n{margin-left:auto;font-weight:500;color:var(--ink-dim)}
  .detail ul{margin:0;padding:0;list-style:none}
  .detail li{display:grid;grid-template-columns:86px 1fr;gap:8px;padding:5px 0;border-bottom:1px solid var(--line);font-size:12px;color:var(--ink);line-height:1.45}
  .detail li.full{display:block}
  .detail li:last-child{border-bottom:0}
  .detail li .dir{font-size:11px;color:var(--ink-mute);padding-top:1px}
  .detail li .mute{color:var(--ink-mute)}
  .detail li .cmi{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;transform:translateY(-1px)}
  .detail .none{margin-top:14px;font-size:11.5px;color:var(--ink-mute)}
  .detail .more{margin-top:6px;font-size:12px}
  .kv{display:grid;grid-template-columns:auto 1fr;font-size:12px}
  .kv .k{padding:5px 12px 5px 0;font-size:11px;color:var(--ink-mute);border-bottom:1px solid var(--line)}
  .kv .v{padding:5px 0;font:11.5px var(--mono);color:var(--ink);border-bottom:1px solid var(--line);text-align:right;min-width:0;overflow-wrap:anywhere}
  .conn-path{display:flex;align-items:center;flex-wrap:wrap;gap:6px;margin-top:10px;font:600 12px var(--mono)}
  .conn-path .ar{color:var(--ink-dim);font-weight:400}
  .store{padding:8px 16px;border-top:1px solid var(--line);font-size:11px;color:var(--ink-mute);line-height:1.45}

  @media (max-width:1180px){.ws{grid-template-columns:1fr}.insp{position:static;max-height:none}}
  .i-acts{display:flex;gap:6px;margin-top:10px}
  .i-acts .tool{height:26px;font-size:11.5px;padding:0 9px}
</style>
</head>
<body data-page="graph">

<aside class="rail" id="rail"></aside>
<header class="topbar" id="topbar"></header>

<main class="wide">
  <div class="page-head">
    <h1 title="Equipment, instruments, camera, maintenance records and documents of the site, and how they connect, from the plant knowledge graph.">Plant knowledge graph</h1>
    <span class="stats" id="stats"></span>
    <span class="src" id="src"></span>
  </div>
  <div class="back-bar" id="back-bar" hidden></div>

  <div class="ws">
    <div class="ws-main">
      <section class="panel" aria-label="Knowledge graph">
        <div class="bar">
          <div class="seg" id="modes" role="group" aria-label="What the graph shows"></div>
          <div class="seg" id="depth" role="group" aria-label="How far from the item"></div>
          <div id="inc-pick"></div>
          <span class="sp"></span>
          <button type="button" class="tool" id="relayout" title="Arrange the graph again" aria-label="Re-arrange"><svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9M13.5 2.5v3h-3"/></svg></button>
          <div class="find" id="pick"></div>
        </div>
        <div class="types" id="types" role="group" aria-label="Node types shown"></div>
        <div class="ctx" id="ctx"></div>
        <div class="canvas" id="canvas">
          <div id="cy" role="img" aria-label="Knowledge graph"></div>
          <div class="zoom">
            <button type="button" data-zoom="in" title="Zoom in" aria-label="Zoom in"><svg width="12" height="12" viewBox="0 0 12 12"><path d="M6 1v10M1 6h10" stroke="currentColor" stroke-width="1.6"/></svg></button>
            <button type="button" data-zoom="out" title="Zoom out" aria-label="Zoom out"><svg width="12" height="12" viewBox="0 0 12 12"><path d="M1 6h10" stroke="currentColor" stroke-width="1.6"/></svg></button>
            <button type="button" data-zoom="fit" title="Fit to screen" aria-label="Fit"><svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M1 4V1h3M8 1h3v3M11 8v3H8M4 11H1V8"/></svg></button>
          </div>
        </div>
        <div class="state-key" id="state-key"></div>
      </section>

      <section class="panel" aria-label="Records">
        <div class="tabs" id="tabs" role="tablist"></div>
        <div class="lane-body" id="lane"><span class="note">Loading records…</span></div>
      </section>
    </div>

    <aside class="panel insp" aria-label="Selected item">
      <div class="i-head" id="i-head"><div class="note">Select a node in the graph.</div></div>
      <div id="i-stats"></div>
      <div class="detail" id="detail"></div>
      <div class="store" id="store"></div>
    </aside>
  </div>
</main>

</body>
</html>
