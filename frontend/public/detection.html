<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Camera observation — Atelic</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/shell.css?v=30">
<script src="js/shell.js?v=29" defer></script>
<script src="js/plumeheat.js?v=1" defer></script>
<script src="js/detection.js?v=34" defer></script>
<style>
  [hidden]{display:none!important}

  /* PRD Screen 2: 65% video / 35% detection metadata */
  .det-grid{display:grid;grid-template-columns:minmax(0,65fr) minmax(0,35fr);gap:14px;min-height:0}
  .det-grid > .panel{min-height:0}
  .panel-head .badge{margin-left:auto}
  .panel-head .badge + .meta{margin-left:0}
  .panel-head .badges{margin-left:auto;display:flex;flex-wrap:wrap;justify-content:flex-end;gap:5px}
  .panel-head .badges .badge{margin-left:0}

  /* ----- video panel ----- */
  .vid-panel{display:flex;flex-direction:column;overflow:hidden}
  /* 2×2 camera wall: each video fills its cell (cover); CAM-01's overlay uses the same crop (slice) */
  .wall{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:6px;padding:6px}
  .cell{display:flex;flex-direction:column;min-height:0;min-width:0;border:1px solid var(--line-strong);border-radius:8px;background:var(--panel);overflow:hidden;transition:border-color var(--t-slow),box-shadow var(--t-slow)}
  .cell.alert{border-color:var(--warn);box-shadow:0 0 0 3px var(--warn-glow)}
  .cv{flex:1;min-height:0;position:relative;display:grid;place-items:center;background:#000}
  .frame{position:absolute;inset:0}
  .frame video{position:absolute;inset:0;width:100%;height:100%;display:block;object-fit:cover}
  .tcx{position:absolute;left:8px;top:8px;display:flex;align-items:center;gap:6px;padding:2px 7px;border-radius:4px;background:rgba(15,23,42,.6);color:rgba(255,255,255,.88);font-family:var(--mono);font-size:10.5px;letter-spacing:.04em;pointer-events:none}
  .tcx i{width:6px;height:6px;border-radius:50%;background:var(--bad);animation:recBlink 1.2s steps(2,start) infinite}
  @keyframes recBlink{to{visibility:hidden}}
  /* plume sits near the top of CAM-01, so crop from the bottom (overlay uses xMidYMin to match) */
  .cam1 .frame video{object-position:center top}
  .frame canvas.heat{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none;filter:blur(3px)}
  .cam1 .frame canvas.heat{object-position:center top}
  .frame svg.overlay{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
  .overlay .mask{fill:var(--warn);fill-opacity:.32;stroke:var(--warn);stroke-width:1.5;vector-effect:non-scaling-stroke}
  .overlay .bbox{fill:none;stroke:var(--accent);stroke-width:1.5;stroke-dasharray:6 4;vector-effect:non-scaling-stroke}
  .overlay .origin line{stroke:#fff;stroke-width:1.5;vector-effect:non-scaling-stroke}
  .overlay .origin circle{fill:none;stroke:#fff;stroke-width:1.5;vector-effect:non-scaling-stroke}
  .no-feed{display:grid;gap:5px;text-align:center;padding:16px;color:rgba(255,255,255,.82);font-size:13px}
  .no-feed span{font-family:var(--mono);font-size:10.5px;color:var(--ink-dim)}
  .no-feed.wide{grid-column:1/-1;grid-row:1/-1;place-self:center;color:var(--ink-mute)}
  .cl{display:flex;align-items:center;gap:8px;padding:6px 10px;border-top:1px solid var(--line);min-width:0}
  .cl b{font-family:var(--mono);font-size:11.5px;font-weight:600}
  .cl .ar{font-size:11.5px;color:var(--ink-mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
  .cl .st{margin-left:auto;display:flex;align-items:center;gap:5px;font-family:var(--mono);font-size:10.5px;color:var(--ink-dim);white-space:nowrap}
  .cl .st i{width:6px;height:6px;border-radius:50%;background:var(--ink-faint)}
  .cl .st.on{color:var(--good)}
  .cl .st.on i{background:var(--good)}
  .cell.alert .cl .st{color:var(--warn);font-weight:600}
  .cell.alert .cl .st i{background:var(--bad);box-shadow:0 0 0 3px rgba(220,38,38,.25);animation:camPulse 1.6s ease-in-out infinite}
  .cl .badge{margin-left:0}
  .wall-foot{padding:8px 14px;border-top:1px solid var(--line);font-size:11.5px;color:var(--ink-dim)}
  .wall-foot:empty{display:none}
  @keyframes camPulse{50%{box-shadow:0 0 0 6px rgba(220,38,38,0)}}
  @media (prefers-reduced-motion:reduce){.cell.alert .cl .st i,.tcx i{animation:none}}

  /* ----- metadata panel ----- */
  .meta-panel{display:flex;flex-direction:column}
  #meta-body{flex:1;min-height:0;overflow-y:auto}
  .status{padding:10px 18px 10px;border-bottom:1px solid var(--line)}
  .status .lbl,.kv .k{font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-dim)}
  .status .big{display:flex;align-items:center;gap:10px;margin-top:3px;font-size:clamp(20px,2.6vh,28px);font-weight:700;letter-spacing:-.01em;line-height:1.15}
  .status .big .sig{width:10px;height:10px;border-radius:50%;background:var(--ink-faint);flex-shrink:0}
  .status.observed .big .sig{background:var(--warn);box-shadow:0 0 0 4px var(--warn-glow)}
  .status.unconfirmed .big{color:var(--ink-mute)}
  .status .by{margin-top:5px;line-height:1.4;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-mute)}
  .status .drawn{display:inline-flex;align-items:center;gap:5px;padding:2px 9px 2px 7px;border-radius:999px;border:1px solid rgba(219,39,119,.25);background:rgba(219,39,119,.08);color:var(--pink);font-size:11.5px;font-weight:600}

  .origin-line{display:flex;align-items:center;gap:8px;padding:7px 18px;white-space:nowrap;border-bottom:1px solid var(--line);font-size:12px;color:var(--ink-mute);background:var(--panel-2)}
  .origin-line b{color:var(--ink);font-weight:600}
  .origin-line a{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--accent);font-weight:600;white-space:nowrap}
  .origin-line .na{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--ink-dim)}

  .kv{display:grid;grid-template-columns:auto 1fr;padding:2px 18px 8px}
  .kv .k{padding:4px 14px 4px 0;white-space:nowrap;border-bottom:1px dashed var(--line);align-self:stretch;display:flex;align-items:center}
  .kv .v{padding:4px 0;white-space:nowrap;border-bottom:1px dashed var(--line);font-family:var(--mono);font-size:12px;color:var(--ink);display:flex;align-items:center;justify-content:flex-end;gap:7px;text-align:right;min-width:0}
  .kv .v.na{color:var(--ink-dim)}
  .kv .k:nth-last-child(2),.kv .v:last-child{border-bottom:0}
  .more{border-top:1px solid var(--line)}
  .more summary{list-style:none;cursor:pointer;display:flex;align-items:baseline;gap:8px;padding:8px 18px;font-size:12px;font-weight:600;color:var(--ink-mute)}
  .more summary::-webkit-details-marker{display:none}
  .more summary::before{content:"›";display:inline-block;transition:transform var(--t);color:var(--ink-dim)}
  .more[open] summary::before{transform:rotate(90deg)}
  .more summary span{font-weight:400;font-size:11px;color:var(--ink-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .more summary:hover{color:var(--accent)}
  .pdot{width:6px;height:6px;border-radius:50%;flex-shrink:0;background:var(--ink-faint)}
  .pdot.experimental_setpoint{background:var(--blue)}
  .pdot.manual_annotation{background:var(--pink)}
  .pdot.model_estimated{background:var(--violet)}
  .pdot.provider_reported{background:var(--accent)}
  .pdot.simulated{background:var(--warn)}

  .caveat{margin:0 0 10px;padding:8px 12px;border-radius:8px;border:1px solid var(--line-strong);border-left:3px solid var(--warn);font-size:12px;color:var(--ink-mute);line-height:1.5}
  .meta-panel.waiting #meta-body > :not(#status-block){display:none}
  .meta-actions .btn.disabled{opacity:.45;pointer-events:none}
  .meta-actions{padding:10px 18px 12px;border-top:1px solid var(--line)}
  .meta-actions .btn{width:100%;justify-content:center;padding:11px 16px}
  .meta-actions small{display:block;text-align:center;margin-top:4px;font-size:11px;color:var(--ink-dim)}

  @media (max-width:1100px){.det-grid{grid-template-columns:1fr}main.fit{height:auto}.wall{height:70vw}}
</style>
</head>
<body data-page="detection" data-stage="detect">

<aside class="rail" id="rail"></aside>
<header class="topbar" id="topbar"></header>

<main class="wide fit">
  <div class="page-head">
    <h1>Camera observation</h1>
  </div>
  <p class="lede">Review the infrared recording and the observation that initiated the investigation.</p>

  <div class="stepper compact" id="stepper"></div>

  <div class="det-grid fill">
    <!-- 65%: 2×2 camera wall -->
    <section class="panel vid-panel" aria-label="Skid cameras">
      <div class="panel-head">
        <h2>Skid cameras</h2>
        <span id="clip-badge"></span>
      </div>
      <div class="wall" id="wall"><div class="no-feed wide"><b>Loading cameras…</b></div></div>
      <div class="wall-foot" id="wall-foot"></div>
    </section>

    <!-- 35%: detection metadata -->
    <section class="panel meta-panel" aria-label="Detection metadata">
      <div class="panel-head">
        <h2>Detection</h2>
        <span class="badges" id="meta-badge"></span>
      </div>
      <div id="meta-body"><div class="status">Loading…</div></div>
      <div class="meta-actions">
        <div class="caveat">The plume image alone does not identify a particular component or quantify emissions.</div>
        <a class="btn primary" id="btn-investigate" href="locate.html">Investigate possible source →</a>
      </div>
    </section>
  </div>
</main>


</body>
</html>
